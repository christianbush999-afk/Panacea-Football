name: Panacea Football Daily Scanner
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run football scanner
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python daily_scan.py
      - name: Commit reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fixtures.csv data/latest_results.csv data/backtest.csv data/scan_state.json
          git diff --cached --quiet || (git commit -m 'Update football research results' && git push)
